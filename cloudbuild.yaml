steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'europe-west4-docker.pkg.dev/$PROJECT_ID/tekenbeetgids/app:$COMMIT_SHA', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west4-docker.pkg.dev/$PROJECT_ID/tekenbeetgids/app:$COMMIT_SHA']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'gcloud'
      - 'run'
      - 'services'
      - 'update'
      - 'tekenbeetgids'
      - '--image=europe-west4-docker.pkg.dev/$PROJECT_ID/tekenbeetgids/app:$COMMIT_SHA'
      - '--region=europe-west4'
images:
  - 'europe-west4-docker.pkg.dev/$PROJECT_ID/tekenbeetgids/app:$COMMIT_SHA'
